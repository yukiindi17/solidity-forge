name: Solidity Forge isolated runner

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Opaque job identifier (project source remains in private Worker KV)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: solidity-forge-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout runner definition
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Fetch private job payload
        id: payload
        env:
          JOB_ID: ${{ inputs.job_id }}
          WORKER_URL: ${{ vars.FORGE_WORKER_URL }}
          CALLBACK_TOKEN: ${{ secrets.FORGE_CALLBACK_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$WORKER_URL"
          test -n "$CALLBACK_TOKEN"
          # KV is eventually consistent across regions; retry propagation before failing.
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors \
            -H "Authorization: Bearer $CALLBACK_TOKEN" \
            "$WORKER_URL/internal/jobs/$JOB_ID" \
            -o "$RUNNER_TEMP/forge-job.json"
          echo "job_file=$RUNNER_TEMP/forge-job.json" >> "$GITHUB_OUTPUT"

      - name: Materialize project and prepare isolated container
        id: prepare
        run: |
          set -euo pipefail
          mkdir -p workspace
          python3 - "$RUNNER_TEMP/forge-job.json" <<'PY'
          import json, pathlib, sys
          job = json.load(open(sys.argv[1], encoding="utf-8"))
          root = pathlib.Path("workspace").resolve()
          for name, body in job["files"].items():
              target = (root / name).resolve()
              if root not in target.parents:
                  raise SystemExit("Unsafe project path")
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(body, encoding="utf-8")
          with open("runner-meta.json", "w", encoding="utf-8") as f:
              json.dump({"kind": job["kind"], "options": job["options"]}, f)
          PY
          sudo chown -R 10001:10001 workspace
          docker build --pull -t solidity-forge-runner:local -f .github/runner.Dockerfile .

      - name: Run Foundry or TypeScript tests in isolated container
        id: execute
        run: |
          set +e
          python3 - <<'PY' > "$RUNNER_TEMP/run-command.sh"
          import json, os, shlex
          meta = json.load(open("runner-meta.json"))
          options = meta["options"]
          if meta["kind"] == "solidity":
              command = "forge test --fuzz-runs {f} --invariant-runs {r} --invariant-depth {d}".format(
                  f=int(options["fuzz_runs"]),
                  r=int(options["invariant_runs"]),
                  d=int(options["invariant_depth"]))
              if options.get("match"):
                  command += " --match-test " + shlex.quote(options["match"])
          else:
              install = options.get("install", "auto")
              has_lock = os.path.exists("workspace/package-lock.json")
              if install == "npm ci":
                  install_command = "npm ci --no-audit --no-fund"
              elif install == "npm install":
                  install_command = "npm install --no-audit --no-fund"
              else:
                  install_command = "npm ci --no-audit --no-fund" if has_lock else "npm install --no-audit --no-fund"
              test = options.get("test_command", "auto")
              if test == "auto":
                  package = json.load(open("workspace/package.json"))
                  test = "npm test" if package.get("scripts", {}).get("test") else "npx hardhat test"
              allowed = {"npm test", "npx hardhat test", "npx mocha", "npx vitest run", "npx jest"}
              if test not in allowed:
                  raise SystemExit("Unsupported test command")
              command = install_command + " && " + test
          print("set -euo pipefail")
          print(command)
          PY
          docker run --rm --network bridge \
            --memory 6g --cpus 2 --pids-limit 256 \
            --cap-drop ALL --security-opt no-new-privileges \
            --read-only --tmpfs /tmp:rw,nosuid,size=1g \
            -e HOME=/tmp -e npm_config_cache=/tmp/npm-cache \
            -e PATH=/home/forge/.foundry/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -v "$PWD/workspace:/workspace:rw" -w /workspace \
            solidity-forge-runner:local bash -lc "$(cat "$RUNNER_TEMP/run-command.sh")" \
            > "$RUNNER_TEMP/forge-output.txt" 2>&1
          code=$?
          echo "$code" > "$RUNNER_TEMP/forge-exit-code"
          exit 0

      - name: Send result to private Worker
        if: always() && steps.payload.outcome == 'success'
        env:
          JOB_ID: ${{ inputs.job_id }}
          WORKER_URL: ${{ vars.FORGE_WORKER_URL }}
          CALLBACK_TOKEN: ${{ secrets.FORGE_CALLBACK_TOKEN }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/forge-output.txt" "$RUNNER_TEMP/forge-exit-code" "$RUNNER_TEMP/forge-result.json" <<'PY'
          import json, pathlib, sys
          output_path = pathlib.Path(sys.argv[1])
          output = (output_path.read_text(errors="replace") if output_path.exists() else "Runner failed before test execution.")[-30000:]
          try:
              code = int(pathlib.Path(sys.argv[2]).read_text().strip())
          except Exception:
              code = 1
          pathlib.Path(sys.argv[3]).write_text(json.dumps({
              "passed": code == 0, "exit_code": code, "output": output
          }), encoding="utf-8")
          PY
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/forge-result.json" \
            "$WORKER_URL/internal/results/$JOB_ID"

      - name: Fail workflow if tests failed
        if: always() && steps.execute.outcome == 'success'
        run: |
          code="$(cat "$RUNNER_TEMP/forge-exit-code" 2>/dev/null || echo 1)"
          if [ "$code" != "0" ]; then
            echo "Solidity Forge test failed (exit $code)."
            exit 1
          fi
